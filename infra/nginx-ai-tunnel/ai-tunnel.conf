# 노트북 GPU AI 서버로 가는 리버스 SSH 터널을 도커 브리지에 노출한다.
#
# 왜 필요한가(2026-08-03 실측):
#   터널은 배포 서버 호스트의 127.0.0.1:18000 에만 바인딩된다(sshd 기본값
#   GatewayPorts no). 컨테이너 안의 127.0.0.1 은 그 컨테이너 자신이므로
#   backend 가 터널을 직접 호출할 수 없다.
#
# 이 컨테이너는 network_mode: host 로 돌아 호스트 루프백(=터널)에 닿고,
# 도커 브리지 게이트웨이 172.17.0.1 에 리스너를 열어 브리지 컨테이너가
# 접근할 수 있게 한다. infra_default(172.19.x) 컨테이너에서 172.17.0.1 로
# 도달되는 것을 확인했다(2026-08-03 실측: nc -z 성공).
#
# 포트 18001 을 쓰는 이유: 18000 은 터널이 이미 점유하고 있다.
# 172.17.0.1 에만 바인딩하므로 호스트 외부 인터페이스에는 열리지 않는다.
server {
    listen 172.17.0.1:18001;

    # 프레임은 1280x720 JPEG 약 287KB 다. 4K 도 1.3MB 수준이라 여유를 둔다.
    client_max_body_size 20m;
    client_body_buffer_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 터널 왕복 실측: 평균 548.7ms, p95 1,152ms, 최대 1,211ms(n=20, 287KB).
        # GPU 콜드 스타트가 5.7초라 첫 요청을 흘려보낼 수 있게 넉넉히 준다.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
