# AI 분석 요청의 자동 폴백 프록시.
#
#   backend  ->  nginx:8010  (이 블록)
#                  주력: 172.17.0.1:18001  -> ai-tunnel -> 터널 -> 노트북 GPU
#                  예비: ai-server:8000    -> 서버 CPU
#
# backend 는 AI_SERVER_BASE_URL=http://nginx:8010 하나만 알면 된다.
#
# 왜 upstream + proxy_next_upstream 을 쓰지 않았는가
#   upstream 블록의 서버 이름은 nginx 기동 시 한 번만 해석되고 그 IP 가 고정된다.
#   2026-07-31 실장애가 정확히 그 문제였다(data 서비스 추가로 backend IP 가 밀려
#   전 API 502). 더 나쁜 것은 해석 실패 시 `[emerg] host not found in upstream` 으로
#   nginx 자체가 뜨지 않는다는 점이다 — ai-server 가 재생성되는 중에 nginx 가
#   기동하면 사이트 전체가 죽는다. 오픈소스 nginx 의 upstream 은 resolver 를
#   쓰지 못한다(nginx Plus 기능).
#   그래서 변수 proxy_pass + error_page 로 같은 동작을 만든다. 폴백 조건(연결 실패,
#   connect timeout, 502/503/504)은 동일하게 처리되고, 매 요청이 주력을 먼저
#   시도하므로 터널 복구 시 자동 복귀도 즉시 일어난다(fail_timeout 대기 없음).
#
# 타임아웃은 안쪽이 항상 더 짧아야 한다. 반대가 되면 앞단이 먼저 끊어
# 계산을 마친 결과가 버려진다.
#   AI 내부 P2PNET_SHADOW_TIMEOUT_SECONDS 30s
#     < 이 블록 proxy_read_timeout 35s
#       < backend AI_READ_TIMEOUT PT40S
server {
    listen 8010;

    # 컨테이너 IP 는 배포마다 바뀐다. 상수 호스트명은 기동 시 1회만 해석되므로
    # 반드시 변수로 둔다. 자세한 근거는 default.conf 주석 참고.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $ai_primary 172.17.0.1:18001;
    set $ai_backup ai-server;

    # 프레임은 1280x720 JPEG 약 287KB, 4K 는 1.3MB 수준이다.
    client_max_body_size 20m;
    # 폴백 시 멀티파트 본문을 예비 업스트림으로 다시 보내야 한다.
    # proxy_request_buffering 기본값 on 이 본문을 끝까지 받아두므로 재전송이 된다.
    # 이 크기를 넘으면 임시 파일로 흘러가고 그 경우에도 재전송은 가능하다.
    client_body_buffer_size 2m;
    proxy_request_buffering on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;

    # 주력이 블랙홀일 때 폴백까지 걸리는 시간이 이 값이다. 짧게 둔다.
    # 연결 거부는 즉시 실패하므로 이 대기가 없다.
    proxy_connect_timeout 2s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    location / {
        # 업스트림이 돌려준 5xx 도 폴백 대상으로 잡는다. 터널이 끊기면 중계 nginx가
        # 502 를 응답으로 주기 때문에, 이 지시자가 없으면 그대로 backend 로 흘러간다.
        proxy_intercept_errors on;
        error_page 502 503 504 = @ai_backup;

        proxy_pass http://$ai_primary$request_uri;
    }

    # AI 가 HTTP 200 + analysisStatus=FAILED 를 준 경우는 여기로 오지 않는다.
    # 200 은 error_page 대상이 아니므로 그대로 backend 에 전달되고, 백엔드의
    # 1회 재시도 정책이 처리한다(AI 담당자 합의, 2026-08-04).
    # 415/400 도 폴백 대상이 아니라 그대로 전달된다.
    location @ai_backup {
        proxy_pass http://$ai_backup:8000$request_uri;
    }
}
