# MinIO S3 API 앞단의 TLS 종단.
#
# 왜 필요한가:
#   presigned URL은 브라우저가 직접 PUT 하는 주소다. 앱이 https로 서비스되는데
#   이 주소가 http면 브라우저가 mixed content로 판단해 요청을 보내기 전에 막는다.
#   2026-07-29 실측: presign은 200으로 발급되고 media_assets는 PENDING_UPLOAD인데
#   MinIO 버킷이 완전히 비어 있었다. 요청이 도달한 흔적 자체가 없었다.
#
# 왜 MinIO 자체 TLS가 아니라 여기서 종단하는가:
#   MinIO에 인증서를 붙이면 내부 통신(backend → minio:9000)도 https가 된다.
#   그런데 인증서는 i15a503.p.ssafy.io용이라 호스트명 minio와 맞지 않아
#   백엔드의 TLS 검증이 실패한다. 여기서 종단하면 내부 구간은 평문으로 두면 되고
#   (같은 호스트의 도커 네트워크라 노출 구간이 아니다) backend의 MINIO_ENDPOINT도
#   건드릴 필요가 없다. presign URL 문자열만 MINIO_PUBLIC_ENDPOINT로 바뀐다.
#
# 서명 호환이 이 파일의 핵심이다:
#   presigned URL은 host와 경로를 함께 서명한다. MinIO가 같은 값으로 재계산해야
#   서명이 일치하므로
#     - Host는 $http_host로 그대로 넘긴다($host는 포트를 버려서 9200이 빠진다)
#     - 경로를 잘라내거나 다시 인코딩하지 않는다. $request_uri는 클라이언트가 보낸
#       경로와 쿼리를 그대로 담으므로 서명 대상이 보존된다(실제 presigned URL로
#       검증함, 2026-07-31)
server {
    listen 9443 ssl;

    # 업스트림 이름을 런타임에 재해석한다. 두 가지 이유가 있고 둘 다 실측이다.
    #   1. 상수 호스트명은 기동 시 한 번만 해석하고 IP를 영구 캐시한다. 컨테이너가
    #      재생성돼 IP가 바뀌면 따라가지 못한다(2026-07-31 default.conf 쪽 실장애).
    #   2. 더 위험한 쪽: 상수 호스트명은 기동 시 해석에 실패하면
    #      `[emerg] host not found in upstream "minio"`로 nginx 전체가 뜨지 않는다.
    #      minio가 재생성되는 중에 nginx가 기동하면 MinIO뿐 아니라 앱 전체가 죽는다.
    #      변수 proxy_pass는 기동 시 해석하지 않으므로 이 연쇄가 끊긴다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $minio_upstream minio;

    # Caddy(OpenVidu 스택)가 발급·갱신하는 인증서를 읽기 전용으로 공유한다.
    # 파일이 아니라 디렉터리를 마운트한다 — 갱신 때 파일이 교체되면 파일 단위
    # 바인드 마운트는 옛 inode를 계속 가리켜 새 인증서가 보이지 않는다.
    # 갱신 후에는 nginx를 reload해야 적용된다(배포·복구 런북 항목).
    ssl_certificate     /etc/nginx/certs/i15a503.p.ssafy.io.crt;
    ssl_certificate_key /etc/nginx/certs/i15a503.p.ssafy.io.key;

    # 이미지는 장당 10MB, 최대 5장. nginx 기본값은 1MB라 그대로 두면 413으로 죽는다.
    client_max_body_size 20m;
    # 업로드 본문을 디스크에 다 받은 뒤 전달하지 않고 그대로 흘려보낸다.
    proxy_request_buffering off;

    # safy-ai-models 는 AI 모델 가중치 저장소다(P2PNet 82MB, S15P11A503-137).
    #
    # ai-server 는 도커 브리지 내부에서 http://minio:9000 으로 직접 받으므로 이
    # TLS 진입점을 거칠 이유가 없다. 그런데 버킷에는 익명 download 정책을 부여한다 -
    # 자격증명을 컨테이너에 넣지 않고, presigned URL 의 만료(mc 상한 7일 실측,
    # 2026-07-31)도 피하기 위한 선택이다. 그래서 이 규칙이 가중치를 인터넷에서
    # 떼어놓는 유일한 경계다. 지우면 9200 으로 누구나 내려받을 수 있다.
    #
    # 접두어 매칭이라 /safy-ai-models 와 그 하위 경로를 모두 막는다.
    # 403 이 아니라 404 로 답해 버킷 존재 여부도 알리지 않는다.
    location ^~ /safy-ai-models {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://$minio_upstream:9000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 server 블록은 TLS 전용이라 고정값으로 둔다.
        proxy_set_header X-Forwarded-Proto https;
    }
}
