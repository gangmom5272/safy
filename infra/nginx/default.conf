server {
    listen 80;

    # 도커 내장 DNS로 업스트림 이름을 런타임에 다시 해석한다.
    #
    # 왜 필요한가 (2026-07-31 실장애):
    #   compose에 data 서비스를 추가하니 infra-data-1이 backend가 쓰던 172.19.0.6을
    #   차지하고 backend는 172.19.0.8로 밀렸다. proxy_pass에 호스트명을 그대로 쓰면
    #   nginx는 기동 시 한 번만 해석하고 그 IP를 영구히 캐시한다. nginx는 설정이
    #   바뀌지 않아 재생성되지 않았고, 캐시된 .6(그 시점엔 data, 8000 리스닝)으로 계속
    #   8080을 호출해 전 API가 502가 됐다. `nginx -s reload`로는 풀리지 않고
    #   `docker restart infra-nginx-1`이 필요했다.
    #
    #   격리 실험으로 대조 검증했다(2026-07-31). 업스트림 컨테이너를 재생성해 IP를
    #   옮겼을 때 호스트명 직접 지정은 502(옛 IP로 connect refused), 아래 방식은 200
    #   유지. 전달되는 경로·쿼리·퍼센트 인코딩(%2F %2B %3D)과 Host 헤더(포트 포함)는
    #   두 방식이 완전히 같았다.
    #
    #   부수 효과: 변수 proxy_pass는 기동 시 이름을 해석하지 않으므로 backend가 아직
    #   없어도 nginx가 뜬다(전에는 해석 실패 시 기동이 막혔다).
    #
    #   ipv6=off: 내장 DNS가 AAAA를 돌려주면 IPv6로 먼저 붙으려다 실패한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # proxy_pass에 변수가 들어가야 런타임 재해석이 일어난다. 상수 호스트명은 안 된다.
    set $backend_upstream backend;

    # 프록시 공통 헤더 - 아래 proxy_pass 블록들이 상속한다.
    # Host에 $host가 아니라 $http_host를 쓰는 이유: $host는 포트를 버린다.
    # Spring Security는 이 Host로 OAuth2 redirect_uri를 만드는데, 포트가 빠지면
    # redirect_uri가 http://도메인/login/oauth2/code/kakao 가 되어 80번(OpenVidu
    # Caddy)으로 콜백이 가버린다. 실측으로 확인함(2026-07-28).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 헬스체크 전용 엔드포인트 - 항상 200. Uptime Kuma / docker healthcheck가 사용.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 백엔드 API 프록시
    # `/api` 접두어가 잘리면 백엔드가 404를 낸다(백엔드는 /api/v1/... 로 서빙).
    # $request_uri는 클라이언트가 보낸 원본 경로+쿼리 그대로라 접두어가 유지된다.
    location /api/ {
        proxy_pass http://$backend_upstream:8080$request_uri;
    }

    # Spring Security OAuth2 경로 - 소셜 로그인 시작과 콜백.
    # 둘 다 /api/ 밖이라 별도 프록시가 필요하다. 없으면 아래 SPA 폴백으로
    # 흘러가 index.html이 반환되고 화면에 앱의 404가 뜬다(실측, 2026-07-28).
    #   /oauth2/authorization/{provider}  로그인 시작 → 카카오·구글로 302
    #   /login/oauth2/code/{provider}     제공자가 돌려보내는 콜백
    # /login/oauth2/ 는 SPA의 /login 라우트보다 긴 접두어라 우선 매칭된다.
    location /oauth2/ {
        proxy_pass http://$backend_upstream:8080$request_uri;
    }

    location /login/oauth2/ {
        proxy_pass http://$backend_upstream:8080$request_uri;
    }

    # 관리자(WEB) 화면 - frontend-admin (base: '/admin/')
    location /admin/ {
        alias /usr/share/nginx/frontend-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 사용자(APP) 화면 - frontend-user
    location / {
        root /usr/share/nginx/frontend-user;
        try_files $uri $uri/ /index.html;
    }
}
