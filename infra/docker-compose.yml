# SAFY 개발 환경 Docker Compose
# ⬜ 표시된 서비스는 BE/AI/DB 담당자 확정 후 세부 설정 채워야 함
#
# ※ OpenVidu는 이 파일에 포함하지 않는다.
#   OpenVidu Community v3(LiveKit+mediasoup)는 자체 공식 Docker Compose 스택(별도 레포)으로
#   독립 실행해야 한다. 단일 이미지로 띄우는 방식(openvidu/openvidu-server 등)은
#   구버전(2.x, Kurento 기반)이라 이번 프로젝트 스펙과 맞지 않는다.
#   로컬 개발: https://github.com/OpenVidu/openvidu-local-deployment (community 디렉토리)
#   실서버 배포: https://github.com/OpenVidu/openvidu-docker-compose-deployment
#   이 앱은 OPENVIDU_URL / OPENVIDU_API_KEY / OPENVIDU_API_SECRET 로 위 스택에 연결만 한다.
#   OpenVidu 자체 녹화(Egress) 저장용 MinIO는 그 스택이 자동으로 포함하므로 여기서 별도 구성 불필요.

# 모든 서비스 공통 로그 설정. json-file 드라이버는 기본적으로 무제한이라
# 로그가 디스크를 가득 채울 수 있어(서버 여유 공간 빠듯) 로테이션을 건다.
# 서비스당 최대 10MB × 3파일 = 30MB로 상한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # Spring Boot (Java 21, Spring Boot 4.1.0) - 확정
  # ==========================================
  backend:
    build: ../backend
    # DEPLOY_TAG는 배포 시 커밋 해시로 지정한다 (기본값 latest는 로컬 개발용).
    # 태그별로 이미지를 남겨둬야 롤백 시 재빌드 없이 그 이미지로 바로 되돌릴 수 있다.
    image: safy-backend:${DEPLOY_TAG:-latest}
    ports:
      # 8080은 OpenVidu ingress가 이미 점유 중(실서버 실측, 2026-07-23).
      # 컨테이너 내부는 기본값 8080 그대로 두고, 호스트에는 디버깅용으로만
      # 8090을 매핑한다. 정식 진입점은 nginx(8091)다.
      - "8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_API_KEY=${OPENVIDU_API_KEY}
      - OPENVIDU_API_SECRET=${OPENVIDU_API_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_UPLOAD_BUCKET=${MINIO_UPLOAD_BUCKET}
    depends_on:
      - db
      - redis
      - minio
    logging: *default-logging
    # 헬스체크: 이 이미지는 jre-alpine(busybox)이라 curl이 없고,
    # 인증 없이 200을 주는 엔드포인트도 없어 컨테이너 내 HEALTHCHECK는 신뢰도가 낮다.
    # 대신 Uptime Kuma가 backend:8080에 TCP 모니터로 가동 여부를 감시한다(MONITORING.md 참고).
    # ⬜ 정확한 빌드 컨텍스트, JAR 실행 방식은 BE 스켈레톤 코드 확인 후 추가
    # ⬜ OpenVidu는 별도 스택이라 depends_on 대상 아님 — 연결 실패 시 재시도 로직 필요

  # ==========================================
  # DB - PostgreSQL - 확정
  # ==========================================
  db:
    image: postgres:16
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      # pg_isready는 postgres 이미지에 기본 포함. 컨테이너 안의 POSTGRES_* 값을 그대로 쓴다.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # Redis - 확정
  # ==========================================
  # 주의: 이건 우리 Spring Boot 전용 Redis다.
  # OpenVidu 내부(Egress/Ingress 조율용)에도 별도 Redis가 필요한데,
  # 그건 OpenVidu 자체 스택 안에서 따로 뜨므로 이 Redis와 절대 공유하지 않는다.
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    logging: *default-logging
    healthcheck:
      # redis-cli는 이미지에 기본 포함. PONG 응답이면 정상.
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ⬜ 용도(세션 캐시/Pub-Sub 등)에 따라 persistence 설정 필요할 수 있음

  # ==========================================
  # MinIO - 제보 업로드(이미지/영상) 저장용 - 확정
  # ==========================================
  # OpenVidu 녹화(Egress) 저장용 MinIO와는 별개의 인스턴스.
  # 시민이 올리는 이미지/영상 제보를 Spring Boot가 이 버킷에 직접 저장한다.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # OpenVidu 자체 MinIO(녹화/Egress용)와 충돌해서 9200/9201로 이미 재배정함
      # (실서버 실측 확인, 2026-07-21, INFRA_DECISIONS.md 참고)
      - "9200:9000"   # S3 API
      - "9201:9001"   # 관리 콘솔
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    logging: *default-logging
    # 헬스체크: 최신 minio 이미지는 curl/mc를 포함하지 않아 컨테이너 내 HEALTHCHECK가 불안정.
    # 대신 Uptime Kuma가 minio:9000/minio/health/live 를 HTTP 모니터로 감시한다(MONITORING.md 참고).

  # ==========================================
  # Python (AI 서버) - FastAPI 확정
  # ==========================================
  ai-server:
    build: ../ai
    ports:
      - "${AI_SERVER_PORT}:${AI_SERVER_PORT}"
    environment:
      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_API_KEY=${OPENVIDU_API_KEY}
      - OPENVIDU_API_SECRET=${OPENVIDU_API_SECRET}
    logging: *default-logging
    # 헬스체크: FastAPI에 /health 엔드포인트가 있어 Kuma로 감시 가능하나,
    # 현재 AI는 기능 미완성으로 배포 대상이 아니고 ai/Dockerfile도 아직 없어
    # 배포 스택에서는 뜨지 않는다. Kuma에는 모니터를 등록하되 '일시정지' 상태로 두고,
    # AI 배포 시작 시 활성화한다(MONITORING.md 참고).
    # ⬜ OpenVidu가 별도 스택이라 depends_on 대상 아님
    # ⬜ uvicorn 실행 커맨드 등 Dockerfile 세부는 AI 담당자 확인 후 추가
    # 예상 형태: uvicorn main:app --host 0.0.0.0 --port ${AI_SERVER_PORT}

  # ==========================================
  # Nginx (reverse proxy + 정적 파일 서빙) - 확정
  # ==========================================
  # 주의: 80/443은 OpenVidu 스택의 Caddy가 이미 점유 중이라(실서버 실측, 2026-07-23)
  # 8091로 노출한다. 도메인 루트(https://i15a503.p.ssafy.io/)로 바로 붙게 하려면
  # Caddy 쪽에 리버스프록시 라우팅을 추가해야 하며, 이는 47과 별개 작업이다.
  nginx:
    image: nginx:alpine
    ports:
      - "8091:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend-user/dist:/usr/share/nginx/frontend-user:ro
      - ../frontend-admin/dist:/usr/share/nginx/frontend-admin:ro
    depends_on:
      - backend
    logging: *default-logging
    healthcheck:
      # default.conf의 전용 /healthz(항상 200)를 busybox wget으로 확인.
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Uptime Kuma - 서비스 상태 대시보드 + 장애 알림 - 확정(S15P11A503-48)
  # ==========================================
  # 모든 서비스 가동 상태를 한 곳에서 보고, 장애 시 Mattermost로 알린다.
  # 모니터/알림 설정은 웹UI 기반이라 이 파일이 아니라 볼륨(uptime_kuma_data)에 저장된다.
  # 구체적 모니터 목록·안티노이즈 설정·Mattermost 연결 절차는 docs/MONITORING.md 참고.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      # 127.0.0.1에만 바인딩 → 공개 노출하지 않고 SSH 터널로만 접근한다.
      # (외부 공개가 필요하면 ufw/보안그룹 개방은 별도 판단, MONITORING.md 참고)
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    logging: *default-logging

volumes:
  db_data:
  minio_data:
  uptime_kuma_data:
