# SAFY 개발 환경 Docker Compose
# ⬜ 표시된 서비스는 BE/AI/DB 담당자 확정 후 세부 설정 채워야 함
#
# ※ OpenVidu는 이 파일에 포함하지 않는다.
#   OpenVidu Community v3(LiveKit+mediasoup)는 자체 공식 Docker Compose 스택(별도 레포)으로
#   독립 실행해야 한다. 단일 이미지로 띄우는 방식(openvidu/openvidu-server 등)은
#   구버전(2.x, Kurento 기반)이라 이번 프로젝트 스펙과 맞지 않는다.
#   로컬 개발: https://github.com/OpenVidu/openvidu-local-deployment (community 디렉토리)
#   실서버 배포: https://github.com/OpenVidu/openvidu-docker-compose-deployment
#   이 앱은 OPENVIDU_URL / OPENVIDU_API_KEY / OPENVIDU_API_SECRET 로 위 스택에 연결만 한다.
#   OpenVidu 자체 녹화(Egress) 저장용 MinIO는 그 스택이 자동으로 포함하므로 여기서 별도 구성 불필요.

# 모든 서비스 공통 로그 설정. json-file 드라이버는 기본적으로 무제한이라
# 로그가 디스크를 가득 채울 수 있어(서버 여유 공간 빠듯) 로테이션을 건다.
# 서비스당 최대 10MB × 3파일 = 30MB로 상한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 통합 로그 수집(S15P11A503-104). OpenVidu 스택이 이미 Loki+Grafana+Alloy를 운영 중이고,
# Alloy는 컨테이너 이름이 아니라 docker 라벨 logging=true 로 수집 대상을 발견한다
# (/opt/openvidu/config/config.alloy 의 discovery.docker 필터, refresh_interval 5s).
# 따라서 이 라벨을 붙이는 것만으로 우리 서비스 로그가 기존 Grafana에 함께 들어간다.
# OpenVidu 쪽 파일은 건드리지 않는다 — 업그레이드 시 덮어써지기 때문이다.
#
# Alloy의 relabel 규칙은 컨테이너 이름 하나만 Loki 라벨로 옮기므로 다른 커스텀 라벨을
# 붙여도 조회에 쓸 수 없다. 우리 서비스는 {container=~"infra-.*"} 로 조회한다.
# Loki 보존 기간 32일. json-file 로테이션(위)은 그대로 유지된다 — Alloy는 docker API로
# 읽어갈 뿐이라 로컬 로그를 대체하지 않는다.
x-loki-logging: &loki-logging
  - "logging=true"

services:
  # ==========================================
  # Spring Boot (Java 21, Spring Boot 4.1.0) - 확정
  # ==========================================
  backend:
    build: ../backend
    # DEPLOY_TAG는 배포 시 커밋 해시로 지정한다 (기본값 latest는 로컬 개발용).
    # 태그별로 이미지를 남겨둬야 롤백 시 재빌드 없이 그 이미지로 바로 되돌릴 수 있다.
    image: safy-backend:${DEPLOY_TAG:-latest}
    ports:
      # 8080은 OpenVidu ingress가 이미 점유 중(실서버 실측, 2026-07-23).
      # 컨테이너 내부는 기본값 8080 그대로 두고, 호스트에는 디버깅용으로만
      # 8090을 매핑한다. 정식 진입점은 nginx(8091)다.
      # 127.0.0.1 바인딩: 디버깅용 포트를 인터넷에 노출할 이유가 없다.
      # 외부에서 봐야 하면 SSH 터널을 쓴다.
      - "127.0.0.1:8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_API_KEY=${OPENVIDU_API_KEY}
      - OPENVIDU_API_SECRET=${OPENVIDU_API_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      # presigned URL은 브라우저가 직접 PUT하는 주소라, 브라우저 기준으로
      # 닿는 호스트로 서명돼야 한다. 내부 이름(minio:9000)으로 발급하면
      # 브라우저가 그 주소를 알 수 없어 업로드가 100% 실패한다.
      # 미지정 시 application.yml이 MINIO_ENDPOINT로 대체하므로 반드시 채운다.
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_UPLOAD_BUCKET=${MINIO_UPLOAD_BUCKET}
      # 녹화(Egress)가 업로드할 주소. 위 MINIO_ENDPOINT와 다른 값이다 — 그건 backend가
      # 직접 쓰는 브리지 내부 주소이고, 이건 host 네트워크인 egress가 쓸 주소다.
      # 기본값을 비우면 안 된다. Spring의 ${VAR:기본값}은 변수가 '없을 때'만 기본값을
      # 쓰고 빈 문자열이면 그대로 빈 값을 써서, 녹화 시작이 설정 누락으로 실패한다.
      # 그래서 미설정 시 기존 동작과 같도록 내부 주소를 기본값으로 둔다.
      - LIVE_RECORDING_S3_ENDPOINT=${LIVE_RECORDING_S3_ENDPOINT:-http://minio:9000}
      # 인증/OAuth/CORS — backend가 부팅·로그인에 요구하는 값. .env에 정의돼 있어도
      # 여기 나열해야 컨테이너로 전달된다(.env는 ${} 치환용일 뿐 자동 주입 아님).
      # JWT_SECRET 미전달 시 "JWT_SECRET must be at least 32 bytes"로 부팅 실패(2026-07-27 실측).
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-Lax}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - OAUTH2_SUCCESS_REDIRECT_URI=${OAUTH2_SUCCESS_REDIRECT_URI}
      - OAUTH2_FAILURE_REDIRECT_URI=${OAUTH2_FAILURE_REDIRECT_URI}
      # 구글/카카오 자격증명. .env에서 빈 값이면 not-configured로 대체해 backend가
      # 부팅되게 한다(application.yml의 ${...:not-configured} 기본값과 동일 의도).
      # 빈 문자열을 그대로 넘기면 "Client id must not be empty"로 부팅 실패하므로 :- 기본값 필수.
      # 실제 소셜로그인은 팀이 자격증명 발급해 .env에 채우면 그대로 전달돼 동작한다.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-not-configured}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-not-configured}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-not-configured}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-not-configured}
      # 카카오 로컬 API(좌표 → 행정구역 역지오코딩) 키.
      # 소셜로그인용 KAKAO_CLIENT_*와는 다른 값이다.
      # 제보 라우팅(ReportRoutingProcessor)과 홈 화면의 /locations/resolve가
      # 이 키에 의존한다. 비어 있으면 예외가 발생해 제보가 관제센터에
      # 배정되지 않고 재시도만 반복한다(KakaoAdministrativeAreaResolver).
      - KAKAO_LOCAL_REST_API_KEY=${KAKAO_LOCAL_REST_API_KEY:-}
      # 최초 관리자 계정. 값이 있으면 부팅 시 SuperAdminInitializer가 생성한다.
      # 비어 있으면 admin_credentials가 비어 어드민 로그인 자체가 불가능하다.
      - SUPER_ADMIN_LOGIN_ID=${SUPER_ADMIN_LOGIN_ID:-}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - SUPER_ADMIN_DISPLAY_NAME=${SUPER_ADMIN_DISPLAY_NAME:-Super Admin}
      # 공공데이터 수집을 요청할 data 서비스 주소.
      # application.yml의 기본값 http://localhost:8000은 backend 컨테이너 자신을 가리켜
      # 절대 닿지 않는다(2026-07-31 실측: 2분마다 ConnectException 반복). 브리지 이름으로 지정한다.
      - PUBLIC_DATA_BASE_URL=${PUBLIC_DATA_BASE_URL:-http://data:8000}
      # 아래 기본값은 모두 팀 합의값이라 .env에서 덮지 않는다. 한도는 2026-07-31에 확인했다.
      #
      # 혼잡도 3분 = 장소 121곳 × 480회 = 하루 58,080회. 서울시(citydata_ppltn, citydata)는
      #   호출 횟수 제한이 없다. 열린데이터광장 안내문의 "1,000건"은 1회 호출당 행 수 상한이고
      #   괄호에 "호출 횟수 제한은 없습니다"로 명시돼 있다. "1일 1,000회"는 실시간 지하철
      #   API 전용이라 citydata에는 해당하지 않는다. 혼잡도는 장소당 1건씩 받으므로
      #   행 수 상한에도 걸리지 않는다.
      - PUBLIC_DATA_CITY_CONGESTION_DELAY=${PUBLIC_DATA_CITY_CONGESTION_DELAY:-PT3M}
      # 재난문자 2분 = 하루 720회. 이쪽은 별개 기관(safetydata.go.kr DSSP-IF-00247)이고
      #   1일 1,000회 제한이 공식 문서에 명시돼 있다. 720회가 72%이고 남는 280회가
      #   S15P11A503-67 재시도 예산이다. 재시도를 넣을 때 요청당 상한만 정하면 장시간 장애
      #   시 매 틱이 3배로 소모되므로(3시간 장애 = 90틱 × 3회 = 270회) 일일 총량 상한이나
      #   서킷 브레이커가 함께 필요하다.
      - PUBLIC_DATA_DISASTER_MESSAGE_DELAY=${PUBLIC_DATA_DISASTER_MESSAGE_DELAY:-PT2M}
      # 행사는 하루 1회(04:00, 121회). S15P11A503-67 본문의 합의값이다(S15P11A503-101).
      #   한도 제약은 없지만 주기를 바꾸려면 그 합의를 다시 확인해야 한다.
      #   하루 1회라 배포 직후에는 결과를 볼 수 없으니, 검증할 때만 .env로 임시로 당기고
      #   확인 후 원복한다.
      - "PUBLIC_DATA_CULTURAL_EVENT_CRON=${PUBLIC_DATA_CULTURAL_EVENT_CRON:-0 0 4 * * *}"
      # 프레임 분석·블러를 요청할 ai-server 주소. PUBLIC_DATA_BASE_URL과 같은 이유로
      # 반드시 넘겨야 한다 — application.yml의 기본값 http://localhost:8000은 backend
      # 컨테이너 자신을 가리키는데 backend는 컨테이너 안에서 8080만 LISTEN한다
      # (2026-08-03 실측: docker port = 8080/tcp -> 127.0.0.1:8090, 8000은 미사용).
      # MediaProcessingWorker가 2초 주기로 폴링하므로, 이 값이 없으면 실제 제보가
      # 들어오는 순간부터 AI 호출이 전건 실패한다. 아직 job이 0건이라 드러나지 않았다.
      # ai-server:8000 도달은 2026-08-03 실측(infra_default에서 /health 200).
      - AI_SERVER_BASE_URL=${AI_SERVER_BASE_URL:-http://ai-server:8000}
    depends_on:
      - db
      - redis
      - minio
    logging: *default-logging
    labels: *loki-logging
    # 헬스체크: 이 이미지는 jre-alpine(busybox)이라 curl이 없고,
    # 인증 없이 200을 주는 엔드포인트도 없어 컨테이너 내 HEALTHCHECK는 신뢰도가 낮다.
    # 대신 Uptime Kuma가 backend:8080에 TCP 모니터로 가동 여부를 감시한다(MONITORING.md 참고).
    # ⬜ 정확한 빌드 컨텍스트, JAR 실행 방식은 BE 스켈레톤 코드 확인 후 추가
    # ⬜ OpenVidu는 별도 스택이라 depends_on 대상 아님 — 연결 실패 시 재시도 로직 필요

  # ==========================================
  # DB - PostgreSQL - 확정
  # ==========================================
  db:
    image: postgres:16
    ports:
      # 127.0.0.1 바인딩 필수. backend는 도커 네트워크 내부 이름(db)으로 붙으므로
      # 호스트 매핑은 순전히 디버깅용이다. 0.0.0.0으로 두면 인터넷에 그대로 열린다.
      # ufw는 이걸 못 막는다 — Docker가 iptables에 직접 규칙을 넣어 ufw보다 먼저
      # 평가되기 때문이다(2026-07-28 실측: 외부에서 5432 접속 성공).
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      # pg_isready는 postgres 이미지에 기본 포함. 컨테이너 안의 POSTGRES_* 값을 그대로 쓴다.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # Redis - 확정
  # ==========================================
  # 주의: 이건 우리 Spring Boot 전용 Redis다.
  # OpenVidu 내부(Egress/Ingress 조율용)에도 별도 Redis가 필요한데,
  # 그건 OpenVidu 자체 스택 안에서 따로 뜨므로 이 Redis와 절대 공유하지 않는다.
  redis:
    image: redis:7
    ports:
      # 127.0.0.1 바인딩 필수. Redis는 비밀번호가 없어서 노출되면 즉시 무방비다.
      # 2026-07-28 실측: 외부에서 PING을 보내 +PONG 응답을 받았다.
      # 리프레시 토큰과 로그아웃 블랙리스트가 들어있어 유출 시 세션 탈취로 이어진다.
      - "127.0.0.1:${REDIS_PORT}:6379"
    logging: *default-logging
    healthcheck:
      # redis-cli는 이미지에 기본 포함. PONG 응답이면 정상.
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ⬜ 용도(세션 캐시/Pub-Sub 등)에 따라 persistence 설정 필요할 수 있음

  # ==========================================
  # MinIO - 제보 업로드(이미지/영상) 저장용 - 확정
  # ==========================================
  # OpenVidu 녹화(Egress) 저장용 MinIO와는 별개의 인스턴스.
  # 시민이 올리는 이미지/영상 제보를 Spring Boot가 이 버킷에 직접 저장한다.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # OpenVidu 자체 MinIO(녹화/Egress용)와 충돌해서 9200/9201로 이미 재배정함
      # (실서버 실측 확인, 2026-07-21, INFRA_DECISIONS.md 참고)
      #
      # S3 API(9000)는 더 이상 호스트에 직접 내지 않는다. 브라우저는 presigned URL로
      # 직접 접근해야 하는데 앱이 https라 http 주소로는 mixed content로 차단된다.
      # 그래서 nginx가 호스트 9200에서 TLS를 종단하고 여기로 평문 프록시한다
      # (nginx/minio.conf 참고). 같은 도커 네트워크 안이라 노출 구간이 아니다.
      # 9200을 nginx가 쓰므로 여기서 중복 바인딩하면 포트 충돌로 기동에 실패한다.
      #
      # 관리 콘솔은 팀만 쓰면 되므로 외부에 열지 않는다. SSH 터널로 접근한다.
      # Egress(녹화)가 업로드할 S3 API 진입점. OpenVidu의 egress 컨테이너는 host
      # 네트워크라 우리 브리지 네트워크의 이름 minio를 해석하지 못한다(2026-07-30 실측:
      # getent hosts minio 실패, wget http://minio:9000 이 exit 4). 반면 host 네트워크에서
      # 호스트 루프백에 게시된 포트는 그대로 닿는다(같은 날 9201로 실측, HTTP 200).
      # 127.0.0.1 바인딩이라 방화벽 추가 개방이 필요 없다 — AWS 콘솔 권한이 없어
      # 새 포트를 열 수 없는 제약과 맞는다. 평문이지만 호스트 밖으로 나가지 않는다.
      - "127.0.0.1:9202:9000"   # Egress 전용 S3 API
      - "127.0.0.1:9201:9001"   # 관리 콘솔
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    logging: *default-logging
    # 헬스체크: 최신 minio 이미지는 curl/mc를 포함하지 않아 컨테이너 내 HEALTHCHECK가 불안정.
    # 대신 Uptime Kuma가 minio:9000/minio/health/live 를 HTTP 모니터로 감시한다(MONITORING.md 참고).

  # ==========================================
  # Python (AI 서버) - FastAPI 확정
  # ==========================================
  ai-server:
    build: ../ai
    image: safy-ai:${DEPLOY_TAG:-latest}
    ports:
      - "127.0.0.1:${AI_SERVER_PORT:-8000}:8000"
    environment:
      - P2PNET_SHADOW_ENABLED=${P2PNET_SHADOW_ENABLED:-false}
      - P2PNET_SHADOW_ROOT=/opt/p2pnet
      - P2PNET_SHADOW_WEIGHT_PATH=/var/cache/safy-ai/models/p2pnet/epoch-003.pth
      - P2PNET_SHADOW_WEIGHT_URL=${P2PNET_SHADOW_WEIGHT_URL:-}
      - P2PNET_ASSET_AUTH_HEADER_NAME=${P2PNET_ASSET_AUTH_HEADER_NAME:-}
      - P2PNET_ASSET_AUTH_HEADER_VALUE=${P2PNET_ASSET_AUTH_HEADER_VALUE:-}
      - P2PNET_ASSET_DOWNLOAD_TIMEOUT_SECONDS=${P2PNET_ASSET_DOWNLOAD_TIMEOUT_SECONDS:-60}
      - P2PNET_SHADOW_DEVICE=cpu
      - P2PNET_SHADOW_THRESHOLD=${P2PNET_SHADOW_THRESHOLD:-0.5}
      - P2PNET_SHADOW_TIMEOUT_SECONDS=${P2PNET_SHADOW_TIMEOUT_SECONDS:-5.0}
      # env.example 에는 있었지만 이 목록에 빠져 있었다(2026-08-03, AI 담당자 지적).
      # compose 는 env_file 을 쓰지 않으므로 여기 선언이 없으면 .env 에 적어도
      # 컨테이너에 전달되지 않고, 보정을 켜려는 시도가 조용히 실패한다.
      # 기본값은 false 를 유지한다 — 서버 실측에서 P2PNet CPU 추론이 4.58초라
      # 5초 프레임 예산의 92%를 먹고, 동시 영상 2개부터 대기열이 발산했다.
      - P2PNET_CONGESTION_CORRECTION_ENABLED=${P2PNET_CONGESTION_CORRECTION_ENABLED:-false}
    volumes:
      - p2pnet_model_cache:/var/cache/safy-ai/models/p2pnet
    restart: unless-stopped
    logging: *default-logging
    labels: *loki-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 서버에 GPU가 없어 CPU 전용으로 돈다(P2PNET_SHADOW_DEVICE=cpu 고정).
    #
    # P2PNet 그림자 분석은 기본 비활성이고 .env의 P2PNET_SHADOW_ENABLED 와
    # P2PNET_SHADOW_WEIGHT_URL 을 채워야 켜진다. 가중치가 없어도 YOLO 공식 분석과
    # /health 는 정상 동작한다(자산 준비 실패 시 P2PNet 만 끄고 YOLO 를 유지한다).
    #
    # 배포 서버 실측(2026-07-31, P2PNet 비활성 상태):
    #   최초 빌드 213s / 이미지 2.85GB / 기동~/health 200 까지 5.2s
    #   추론 후 RSS 341MB(유휴 202MB) / 동시 4요청은 직렬 처리되어 총 470ms
    #   1280x720 서버 처리시간 p95 154ms, HTTP 왕복 p95 205ms
    #     = 5초 프레임 예산의 약 4%. 단 사람 0명 프레임 기준이고 P2PNet 은 미측정이다.

  # ==========================================
  # Data 서버 (FastAPI) — 공공데이터 수집
  # ==========================================
  # backend의 PublicDataCollectionScheduler가 이 서비스에 수집을 요청하고, 받은 결과를
  # 직접 DB에 적재한다. 이 서비스는 DB에 붙지 않고 파일도 쓰지 않는 무상태 서비스라
  # 볼륨이 필요 없다(app 전체에 쓰기 호출 0건, 2026-07-31 확인).
  #
  # ai-server 와 함께 CI 자동 배포 목록에 들어있다(.gitlab-ci.yml deploy).
  data:
    build: ../data
    image: safy-data:${DEPLOY_TAG:-latest}
    ports:
      # 8000은 ai-server가 쓰므로 비켜서 8002에 게시한다(서버 LISTEN 목록에 없음, 실측).
      # backend는 브리지 내부 이름 data:8000으로 접근하므로 이 매핑은 서버에서
      # curl로 수집을 직접 호출해 확인할 때만 쓴다. 그래서 127.0.0.1 바인딩이다.
      - "127.0.0.1:${DATA_SERVER_PORT:-8002}:8000"
    environment:
      - SEOUL_CITYDATA_BASE_URL=${SEOUL_CITYDATA_BASE_URL:-http://openapi.seoul.go.kr:8088}
      - SEOUL_CITYDATA_API_KEY=${SEOUL_CITYDATA_API_KEY}
      - DISASTER_API_BASE_URL=${DISASTER_API_BASE_URL}
      - DISASTER_API_KEY=${DISASTER_API_KEY}
      # 혼잡도·행사는 장소 121곳을 나눠 조회하는 동안 대기하므로 넉넉히 둔다.
      # backend의 read-timeout(기본 PT2M)보다 짧아야 backend가 먼저 끊지 않는다.
      - COLLECTION_TIMEOUT_SECONDS=${COLLECTION_TIMEOUT_SECONDS:-100}
      - DISASTER_COLLECTION_TIMEOUT_SECONDS=${DISASTER_COLLECTION_TIMEOUT_SECONDS:-30}
    restart: unless-stopped
    logging: *default-logging
    labels: *loki-logging
    healthcheck:
      # /health는 수집기를 만들지 않으므로 API 키가 비어 있어도 200을 준다.
      # 즉 이 헬스체크는 프로세스 기동만 확인하고, 수집 가능 여부는
      # data_collection_runs의 status로 판단한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # Nginx (reverse proxy + 정적 파일 서빙) - 확정
  # ==========================================
  # 주의: 80/443은 OpenVidu 스택의 Caddy가 이미 점유 중이라(실서버 실측, 2026-07-23)
  # 이 nginx는 호스트의 80/443을 쓸 수 없다. 대신 Caddy가 넘겨주는 6080을 받는다.
  nginx:
    image: nginx:alpine
    ports:
      # 정식 진입점. OpenVidu Caddy(443, 도메인 정식 인증서)가 여기로 넘겨준다.
      # OpenVidu는 MEET_BASE_PATH(/meet)에 속하지 않는 모든 경로를
      # CUSTOM_APP_INTERNAL_PORT(기본 6080)로 리버스프록시하도록 이미 설정돼 있다
      # (openvidu/config/caddy.yaml의 "Custom User Application" 라우트).
      # 즉 6080에 리스너를 두는 것만으로 https://i15a503.p.ssafy.io/ 가 이 앱을 서빙한다.
      # 실측(2026-07-29): 6080이 비어 있으면 Caddy가 502를 내고 /meet으로 302시킨다.
      # Caddy·OpenVidu 설정 파일은 건드리지 않는다 — 업그레이드 시 덮어써진다.
      # 127.0.0.1 바인딩: 같은 호스트의 Caddy만 쓰므로 인터넷에 열 이유가 없다.
      - "127.0.0.1:6080:80"
      # 디버그·헬스체크용 평문 진입점. TLS가 없어 로그인 세션은 유지되지 않는다
      # (AUTH_COOKIE_SECURE=true면 리프레시 쿠키가 http 요청에 실리지 않는다).
      # 팀이 쓰는 주소는 위 https 쪽이다.
      - "8091:80"
      # MinIO S3 API의 TLS 진입점(nginx/minio.conf). 컨테이너 9443 → 호스트 9200.
      # 9200은 원래 minio가 직접 쓰던 포트다. 이미 열려 있는 포트를 재사용해야
      # 방화벽 추가 개방 없이 https로 바꿀 수 있다(AWS 콘솔 권한이 없다).
      - "9200:9443"
    volumes:
      # conf 파일을 하나씩 마운트하지 않고 디렉터리째 마운트한다.
      # 이유(2026-07-31 실측): CI 배포의 rsync는 임시 파일에 받아 rename으로 교체하므로
      # 파일의 inode가 바뀐다. 파일 단위 바인드 마운트는 마운트 시점의 inode에 묶여 있어
      # 컨테이너 안에서는 계속 옛 내용이 보인다(격리 실험에서 파일 마운트는 옛 내용,
      # 디렉터리 마운트는 새 내용이 보였다). 즉 전에는 conf만 고쳐 배포하면 nginx가
      # 새 설정을 볼 방법이 없었고 컨테이너를 재생성해야만 적용됐다.
      # 디렉터리 마운트면 rsync 후 `docker exec infra-nginx-1 nginx -s reload`로 끝난다.
      # nginx는 conf.d/*.conf 만 include하므로 이 디렉터리의 .gitkeep은 무시된다.
      - ./nginx:/etc/nginx/conf.d:ro
      # Caddy가 관리하는 도메인 인증서를 읽기 전용으로 공유한다.
      # 파일이 아니라 디렉터리를 마운트한다(갱신 시 inode 교체 대응, minio.conf 주석 참고).
      # 로컬에서 이 경로가 없으면 nginx가 기동에 실패하므로 그때는 이 변수로 덮어쓴다.
      - "${MINIO_TLS_CERT_DIR:-/opt/openvidu/data/caddy_data/certificates/acme-v02.api.letsencrypt.org-directory/i15a503.p.ssafy.io}:/etc/nginx/certs:ro"
      - ../frontend-user/dist:/usr/share/nginx/frontend-user:ro
      - ../frontend-admin/dist:/usr/share/nginx/frontend-admin:ro
    depends_on:
      - backend
    logging: *default-logging
    labels: *loki-logging
    healthcheck:
      # default.conf의 전용 /healthz(항상 200)를 busybox wget으로 확인.
      # localhost가 아니라 127.0.0.1을 쓴다. busybox wget은 localhost를 ::1로
      # 먼저 해석하는데 nginx는 IPv4에만 바인딩돼 있어 연결이 거부된다.
      # 이 때문에 서비스는 멀쩡한데 27시간 동안 unhealthy로 표시됐다(2026-07-28).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Uptime Kuma - 서비스 상태 대시보드 + 장애 알림 - 확정(S15P11A503-48)
  # ==========================================
  # 모든 서비스 가동 상태를 한 곳에서 보고, 장애 시 Mattermost로 알린다.
  # 모니터/알림 설정은 웹UI 기반이라 이 파일이 아니라 볼륨(uptime_kuma_data)에 저장된다.
  # 구체적 모니터 목록·안티노이즈 설정·Mattermost 연결 절차는 docs/MONITORING.md 참고.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      # 127.0.0.1에만 바인딩 → 공개 노출하지 않고 SSH 터널로만 접근한다.
      # (외부 공개가 필요하면 ufw/보안그룹 개방은 별도 판단, MONITORING.md 참고)
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    logging: *default-logging

volumes:
  db_data:
  minio_data:
  p2pnet_model_cache:
  uptime_kuma_data:
